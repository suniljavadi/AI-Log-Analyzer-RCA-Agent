services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: log_analyzer
      POSTGRES_USER: log_analyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_analyzer -d log_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://log_analyzer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/log_analyzer
      LLM_MODE: ${LLM_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  dashboard:
    build: .
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data: