services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: log_analyzer
      POSTGRES_USER: log_analyzer
      POSTGRES_PASSWORD: log_analyzer_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://log_analyzer:log_analyzer_dev@postgres:5432/log_analyzer
      LLM_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  dashboard:
    build: .
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  postgres_data:
